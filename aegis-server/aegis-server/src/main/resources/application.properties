spring.application.name=aegis-server
server.port=8081
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/aegis?options=-c%20TimeZone%3DAsia/Kolkata
spring.datasource.username=aegis
spring.datasource.password=aegis123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway (inherits spring.datasource.url / username / password automatically)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Timezone fix (Asia/Calcutta is obsolete; PostgreSQL only accepts Asia/Kolkata)
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=aegis
spring.rabbitmq.password=aegis123

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT (put your own secret, min 256-bit)
aegis.jwt.secret=your-super-secret-key-change-this-in-production-at-least-32-chars!!
aegis.jwt.expiration-ms=86400000
aegis.jwt.refresh-expiration-ms=604800000

# CORS
aegis.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Logging
logging.level.com.aegis=DEBUG