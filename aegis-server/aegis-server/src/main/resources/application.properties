spring.application.name=aegis-server
# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/aegis
spring.datasource.username=aegis
spring.datasource.password=aegis123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=aegis
spring.rabbitmq.password=aegis123

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# WebSocket / Server
server.port=8080

# JWT (put your own secret, min 256-bit)
aegis.jwt.secret=your-super-secret-key-change-this-in-production
aegis.jwt.expiration-ms=86400000