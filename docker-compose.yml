services:

  postgres:
    image: postgres:16
    container_name: aegis-postgres
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: ${DB_USER:-aegis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aegis123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-aegis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: aegis-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-aegis}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-aegis123}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  aegis-server:
    image: ${ECR_REGISTRY}/aegis-server:${IMAGE_TAG:-latest}
    container_name: aegis-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aegis?options=-c%20TimeZone%3DAsia/Kolkata
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-aegis}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-aegis123}
      # RabbitMQ
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBIT_USER:-aegis}
      SPRING_RABBITMQ_PASSWORD: ${RABBIT_PASSWORD:-aegis123}
      # Redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # JWT (CHANGE in production!)
      AEGIS_JWT_SECRET: ${JWT_SECRET}
      AEGIS_JWT_EXPIRATION_MS: 86400000
      AEGIS_JWT_REFRESH_EXPIRATION_MS: 604800000
      # CORS – set to your frontend URL
      AEGIS_CORS_ALLOWED_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # JPA / Flyway
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      # Logging
      LOGGING_LEVEL_COM_AEGIS: INFO
    ports:
      - "8081:8081"
    networks:
      - aegis-net

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:

networks:
  aegis-net:
    driver: bridge