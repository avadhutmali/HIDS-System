name: CI/CD – Aegis Server (ECR)

on:
  push:
    branches: [main]
    paths:
      - "aegis-server/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

env:
  AWS_REGION: ap-south-1        # Mumbai – closest to India
  ECR_REPOSITORY: aegis-server

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1 – Build, Test, Push to Amazon ECR
  # ─────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to Amazon ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build & test with Maven
        working-directory: aegis-server/aegis-server
        run: mvn verify -q

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            aegis-server/aegis-server
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "✅ Pushed $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ─────────────────────────────────────────────────────────────
  # JOB 2 – SSH into EC2 and redeploy
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH & redeploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /opt/aegis

            # Authenticate Docker to ECR using EC2 IAM Role (no credentials needed)
            aws ecr get-login-password --region ap-south-1 | \
              docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}

            # Update IMAGE_TAG to exact commit SHA for traceability
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env

            # Pull new image and restart only the app container
            # (Postgres, RabbitMQ, Redis stay running — zero infra downtime)
            docker compose up -d --no-deps --pull always aegis-server

            # Remove dangling images to save disk space on t2.micro
            docker image prune -f

            echo "✅ Deployed aegis-server:${{ github.sha }}"
